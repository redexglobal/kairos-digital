<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Kairos Digital — Automação com IA para Negócios</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --p:   #7C3AED;
  --p2:  #A855F7;
  --p3:  #C084FC;
  --a:   #06B6D4;
  --a2:  #22D3EE;
  --g:   #10B981;
  --bg:  #030712;
  --bg2: #0a0f1e;
  --bg3: #0f172a;
  --txt: #F1F5F9;
  --txt2:#94A3B8;
  --brd: rgba(124,58,237,0.2);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--txt);font-family:'Inter',sans-serif;overflow-x:hidden;}

/* ── CANVAS PARTICLES ── */
#canvas{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55;}

/* ── NAV ── */
nav{position:fixed;top:0;width:100%;z-index:100;background:rgba(3,7,18,.85);
  backdrop-filter:blur(20px);border-bottom:1px solid var(--brd);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 4rem;height:68px;}
.nav-logo{font-family:'Space Grotesk';font-size:1.35rem;font-weight:700;
  background:linear-gradient(135deg,var(--p2),var(--a));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  letter-spacing:.04em;}
.nav-links{display:flex;gap:2.5rem;list-style:none;}
.nav-links a{color:var(--txt2);text-decoration:none;font-size:.88rem;font-weight:500;
  transition:color .2s;}
.nav-links a:hover{color:var(--txt);}
.nav-cta{background:linear-gradient(135deg,var(--p),var(--p2));
  color:#fff;border:none;padding:.55rem 1.5rem;border-radius:8px;
  font-size:.88rem;font-weight:600;cursor:pointer;transition:opacity .2s;}
.nav-cta:hover{opacity:.85;}

/* ── HERO ── */
#hero{position:relative;z-index:1;min-height:100vh;display:flex;
  align-items:center;justify-content:center;text-align:center;
  padding:100px 2rem 4rem;}
.hero-inner{max-width:860px;}
.hero-badge{display:inline-flex;align-items:center;gap:.5rem;
  background:rgba(124,58,237,.12);border:1px solid rgba(124,58,237,.35);
  border-radius:50px;padding:.4rem 1.1rem;font-size:.78rem;font-weight:600;
  color:var(--p3);letter-spacing:.05em;margin-bottom:1.8rem;}
.hero-badge::before{content:'';width:6px;height:6px;border-radius:50%;
  background:var(--p2);box-shadow:0 0 8px var(--p2);animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}
h1{font-family:'Space Grotesk';font-size:clamp(2.8rem,7vw,5.5rem);
  font-weight:700;line-height:1.08;margin-bottom:1.4rem;}
h1 .hl{background:linear-gradient(135deg,var(--p2) 0%,var(--a) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.hero-desc{font-size:clamp(1rem,2vw,1.2rem);color:var(--txt2);line-height:1.75;
  max-width:620px;margin:0 auto 2.5rem;}
.hero-btns{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;}
.btn-primary{display:inline-flex;align-items:center;gap:.5rem;
  background:linear-gradient(135deg,var(--p),var(--p2));
  color:#fff;font-weight:600;font-size:.95rem;
  padding:.85rem 2rem;border-radius:10px;text-decoration:none;
  box-shadow:0 4px 24px rgba(124,58,237,.45);transition:transform .2s,box-shadow .2s;}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(124,58,237,.65);}
.btn-outline{display:inline-flex;align-items:center;gap:.5rem;
  border:1.5px solid rgba(124,58,237,.5);color:var(--p3);
  font-weight:600;font-size:.95rem;
  padding:.85rem 2rem;border-radius:10px;text-decoration:none;
  transition:background .2s,border-color .2s;}
.btn-outline:hover{background:rgba(124,58,237,.1);border-color:var(--p2);}

/* hero stats */
.hero-stats{display:flex;gap:3rem;justify-content:center;flex-wrap:wrap;
  margin-top:4rem;padding-top:3rem;
  border-top:1px solid rgba(255,255,255,.06);}
.stat{text-align:center;}
.stat-n{font-family:'Space Grotesk';font-size:2.2rem;font-weight:700;
  background:linear-gradient(135deg,var(--p2),var(--a));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.stat-l{font-size:.8rem;color:var(--txt2);margin-top:.2rem;}

/* ── SECTION COMMONS ── */
section{position:relative;z-index:1;padding:6rem 2rem;}
.container{max-width:1180px;margin:0 auto;}
.sec-label{font-size:.72rem;font-weight:700;letter-spacing:.18em;
  text-transform:uppercase;color:var(--p3);margin-bottom:.6rem;}
.sec-title{font-family:'Space Grotesk';font-size:clamp(1.8rem,4vw,2.8rem);
  font-weight:700;line-height:1.2;margin-bottom:.8rem;}
.sec-title .hl{background:linear-gradient(135deg,var(--p2),var(--a));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.sec-desc{color:var(--txt2);line-height:1.7;font-size:.95rem;max-width:540px;}

/* divider */
.divider{width:100%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(124,58,237,.4),transparent);
  margin:0;}

/* ── SOLUTIONS ── */
#solucoes{background:var(--bg2);}
.sol-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
  gap:1.5rem;margin-top:3.5rem;}
.sol-card{background:var(--bg3);border:1px solid var(--brd);border-radius:20px;
  padding:2rem;transition:transform .3s,border-color .3s,box-shadow .3s;
  position:relative;overflow:hidden;}
.sol-card::before{content:'';position:absolute;inset:0;opacity:0;
  background:linear-gradient(135deg,rgba(124,58,237,.08),transparent);
  transition:opacity .3s;}
.sol-card:hover{transform:translateY(-6px);border-color:rgba(124,58,237,.5);
  box-shadow:0 16px 40px rgba(124,58,237,.15);}
.sol-card:hover::before{opacity:1;}
.sol-icon{width:52px;height:52px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.5rem;margin-bottom:1.3rem;}
.sol-icon.purple{background:rgba(124,58,237,.15);}
.sol-icon.cyan{background:rgba(6,182,212,.15);}
.sol-icon.green{background:rgba(16,185,129,.15);}
.sol-icon.orange{background:rgba(249,115,22,.15);}
.sol-name{font-family:'Space Grotesk';font-size:1.15rem;font-weight:700;
  margin-bottom:.5rem;}
.sol-desc{font-size:.88rem;color:var(--txt2);line-height:1.65;}
.sol-tag{display:inline-block;margin-top:1.1rem;font-size:.72rem;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;
  background:rgba(124,58,237,.12);color:var(--p3);
  padding:.28rem .75rem;border-radius:50px;border:1px solid rgba(124,58,237,.25);}

/* ── COMO FUNCIONA ── */
#como{background:var(--bg);}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:1.5rem;margin-top:3.5rem;}
.step{text-align:center;padding:2rem 1.5rem;}
.step-num{width:56px;height:56px;border-radius:50%;
  background:linear-gradient(135deg,var(--p),var(--p2));
  display:flex;align-items:center;justify-content:center;
  font-family:'Space Grotesk';font-size:1.3rem;font-weight:700;
  margin:0 auto 1.2rem;box-shadow:0 4px 20px rgba(124,58,237,.4);}
.step-name{font-family:'Space Grotesk';font-size:1.05rem;font-weight:700;margin-bottom:.5rem;}
.step-desc{font-size:.85rem;color:var(--txt2);line-height:1.65;}

/* ── SOBRE / EQUIPE ── */
#sobre{background:var(--bg2);}
.sobre-grid{display:grid;grid-template-columns:1fr 1fr;gap:4rem;align-items:center;}
.sobre-text .sec-desc{max-width:100%;font-size:1rem;}
.sobre-text p+p{margin-top:1rem;}
.equipe{display:flex;gap:2rem;margin-top:2.5rem;flex-wrap:wrap;}
.membro{display:flex;align-items:center;gap:1rem;
  background:var(--bg3);border:1px solid var(--brd);border-radius:16px;
  padding:1.1rem 1.4rem;flex:1;min-width:200px;}
.membro-avatar{width:52px;height:52px;border-radius:50%;
  background:linear-gradient(135deg,var(--p),var(--a));
  display:flex;align-items:center;justify-content:center;
  font-family:'Space Grotesk';font-size:1.2rem;font-weight:700;
  flex-shrink:0;overflow:hidden;}
.membro-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.membro-nome{font-weight:700;font-size:.95rem;}
.membro-cargo{font-size:.78rem;color:var(--p3);font-weight:500;}
.sobre-visual{background:var(--bg3);border:1px solid var(--brd);border-radius:24px;
  padding:2rem;display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
.mini-card{background:var(--bg2);border:1px solid var(--brd);border-radius:14px;
  padding:1.2rem;text-align:center;}
.mini-card .ic{font-size:1.8rem;margin-bottom:.5rem;}
.mini-card strong{display:block;font-family:'Space Grotesk';font-size:1.4rem;
  font-weight:700;background:linear-gradient(135deg,var(--p2),var(--a));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.mini-card span{font-size:.72rem;color:var(--txt2);}

/* ── CTA ── */
#cta{background:var(--bg);text-align:center;}
.cta-box{background:linear-gradient(135deg,rgba(124,58,237,.15),rgba(6,182,212,.1));
  border:1px solid rgba(124,58,237,.3);border-radius:28px;
  padding:4rem 3rem;max-width:760px;margin:0 auto;
  box-shadow:0 0 80px rgba(124,58,237,.12);}
.cta-box h2{font-family:'Space Grotesk';font-size:clamp(1.8rem,4vw,2.8rem);
  font-weight:700;margin-bottom:1rem;}
.cta-box p{color:var(--txt2);font-size:1rem;line-height:1.7;margin-bottom:2rem;}
.wa-btn{display:inline-flex;align-items:center;gap:.7rem;
  background:linear-gradient(135deg,#16a34a,#22c55e);
  color:#fff;font-weight:700;font-size:1rem;
  padding:1rem 2.5rem;border-radius:12px;text-decoration:none;
  box-shadow:0 4px 24px rgba(34,197,94,.4);transition:transform .2s,box-shadow .2s;}
.wa-btn:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(34,197,94,.6);}

/* ── FOOTER ── */
footer{position:relative;z-index:1;background:var(--bg);
  border-top:1px solid var(--brd);padding:2.5rem 4rem;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;}
.foot-logo{font-family:'Space Grotesk';font-size:1.1rem;font-weight:700;
  background:linear-gradient(135deg,var(--p2),var(--a));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
footer p{font-size:.78rem;color:var(--txt2);}

/* ── RESPONSIVE ── */
@media(max-width:768px){
  nav{padding:0 1.5rem;}
  .nav-links{display:none;}
  .sobre-grid{grid-template-columns:1fr;gap:2rem;}
  footer{padding:2rem 1.5rem;flex-direction:column;text-align:center;}
}

    button,a,[onclick]{cursor:pointer!important;}
    .c-dot{position:fixed;width:11px;height:11px;background:var(--gold);border-radius:50%;pointer-events:none;z-index:99999;transform:translate(-50%,-50%);box-shadow:0 0 10px rgba(245,158,11,.8);transition:transform .08s;}
    .c-ring{position:fixed;width:32px;height:32px;border:2px solid rgba(245,158,11,.45);border-radius:50%;pointer-events:none;z-index:99998;transform:translate(-50%,-50%);transition:left .1s,top .1s;}
    .c-trail{position:fixed;border-radius:50%;pointer-events:none;z-index:99997;transform:translate(-50%,-50%);}
    .portal-ov{position:fixed;inset:0;z-index:99990;pointer-events:none;}
    .portal-ov.go{pointer-events:all;}
    .hg-widget{position:fixed;bottom:1.4rem;left:1.4rem;z-index:300;background:rgba(3,7,18,.9);border:1px solid rgba(245,158,11,.35);border-radius:16px;padding:.9rem 1.1rem;width:175px;backdrop-filter:blur(14px);box-shadow:0 8px 30px rgba(0,0,0,.45);}
    .hg-ttl{font-size:.6rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:.5rem;text-align:center;}
    .hg-svg-w{display:flex;justify-content:center;margin-bottom:.5rem;}
    .hg-msg{font-size:.67rem;color:var(--txt2);text-align:center;line-height:1.4;}
    .hg-urg{font-size:.69rem;font-weight:700;color:#ef4444;text-align:center;margin-top:.25rem;animation:blink 1.4s infinite;}
    .hg-cta-btn{display:block;width:100%;margin-top:.6rem;background:linear-gradient(135deg,var(--p),var(--p2));border:none;color:#fff;font-size:.7rem;font-weight:700;padding:.42rem;border-radius:7px;text-align:center;cursor:pointer!important;transition:opacity .2s;}
    .hg-cta-btn:hover{opacity:.85;}


    /* CEO CARD */
    .ceo-card{display:flex;gap:1.8rem;background:var(--bg2);border:1px solid var(--brd);border-radius:20px;padding:1.8rem;margin-top:0;align-items:flex-start;transition:border-color .3s;}
    .ceo-card:hover{border-color:rgba(245,158,11,.4);}
    .ceo-photo-wrap{position:relative;flex-shrink:0;}
    .ceo-photo{width:140px;height:170px;object-fit:cover;object-position:top center;border-radius:14px;display:block;border:2px solid rgba(245,158,11,.3);}
    .ceo-glow{position:absolute;inset:-4px;border-radius:16px;background:linear-gradient(135deg,rgba(245,158,11,.15),rgba(124,58,237,.1));z-index:-1;filter:blur(8px);}
    .ceo-badge{display:inline-block;font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:linear-gradient(135deg,rgba(245,158,11,.15),rgba(124,58,237,.1));border:1px solid rgba(245,158,11,.3);color:var(--gold);padding:.22rem .7rem;border-radius:50px;margin-bottom:.5rem;}
    .ceo-name{font-family:'Space Grotesk';font-size:1.4rem;font-weight:800;margin-bottom:.15rem;}
    .ceo-title{font-size:.8rem;color:var(--p3);font-weight:600;margin-bottom:.7rem;}
    .ceo-bio{font-size:.82rem;color:var(--txt2);line-height:1.65;margin-bottom:.9rem;}
    .ceo-tags{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.85rem;}
    .ceo-tag{font-size:.7rem;font-weight:600;background:rgba(124,58,237,.1);border:1px solid rgba(124,58,237,.22);color:var(--p3);padding:.2rem .6rem;border-radius:50px;}
    .ceo-elite{background:rgba(245,158,11,.06);border:1px solid rgba(245,158,11,.18);border-radius:10px;padding:.6rem .85rem;margin-bottom:.85rem;}
    .elite-label{font-size:.62rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:.25rem;}
    .elite-names{font-size:.76rem;color:var(--txt2);}
    .ceo-contacts{display:flex;flex-wrap:wrap;gap:.5rem;}
    .ceo-contact-btn{display:inline-flex;align-items:center;gap:.4rem;background:rgba(37,211,102,.12);border:1px solid rgba(37,211,102,.28);color:#25D366;font-size:.75rem;font-weight:600;padding:.38rem .75rem;border-radius:8px;text-decoration:none;transition:all .2s;}
    .ceo-contact-btn:hover{background:rgba(37,211,102,.22);color:#fff;}
    .ceo-contact-btn.ig{background:rgba(225,48,108,.1);border-color:rgba(225,48,108,.28);color:#E1306C;}
    .ceo-contact-btn.ig:hover{background:rgba(225,48,108,.2);color:#fff;}
    .membro-placeholder{display:flex;align-items:center;gap:1rem;background:var(--bg2);border:1px dashed var(--brd);border-radius:14px;padding:1.1rem 1.3rem;}
    @media(max-width:640px){.ceo-card{flex-direction:column;}.ceo-photo{width:100%;height:220px;}}


    .urgency-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.45rem;margin-top:.3rem;}
    .urgency-opt{background:var(--bg3);border:1px solid var(--brd);border-radius:10px;
      padding:.65rem .5rem;text-align:center;cursor:pointer;transition:all .2s;}
    .urgency-opt:hover{border-color:rgba(124,58,237,.5);background:rgba(124,58,237,.08);}
    .urgency-opt.sel{border-color:var(--p2);background:rgba(124,58,237,.15);}
    .urg-icon{display:block;font-size:1.3rem;margin-bottom:.2rem;}
    .urg-label{display:block;font-size:.75rem;font-weight:700;color:var(--txt);}
    .urg-sub{display:block;font-size:.62rem;color:var(--txt2);margin-top:.1rem;}


    /* ── CYBERPUNK GLOBAL ── */
    body::after{content:'';position:fixed;inset:0;z-index:9998;pointer-events:none;
      background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,245,255,.015) 2px,rgba(0,245,255,.015) 4px);
      animation:scanlines 8s linear infinite;}
    @keyframes scanlines{0%{background-position:0 0;}100%{background-position:0 100px;}}

    /* NAV cyberpunk */
    nav{border-bottom:1px solid rgba(0,245,255,.25);box-shadow:0 0 30px rgba(0,245,255,.08);}
    .nav-logo span{background:linear-gradient(135deg,#00F5FF,#FF006E);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-shadow:none;}

    /* GLITCH TITLE */
    .glitch-text{position:relative;display:inline-block;}
    .glitch-text::before,.glitch-text::after{content:attr(data-text);position:absolute;top:0;left:0;width:100%;height:100%;background:transparent;}
    .glitch-text::before{left:2px;text-shadow:-2px 0 #FF006E;clip:rect(44px,450px,56px,0);animation:glitch1 3.5s infinite linear alternate-reverse;}
    .glitch-text::after{left:-2px;text-shadow:2px 0 #00F5FF;clip:rect(44px,450px,56px,0);animation:glitch2 3s infinite linear alternate-reverse;}
    @keyframes glitch1{0%{clip:rect(14px,9999px,36px,0);}20%{clip:rect(68px,9999px,5px,0);}40%{clip:rect(91px,9999px,74px,0);}60%{clip:rect(11px,9999px,50px,0);}80%{clip:rect(77px,9999px,23px,0);}100%{clip:rect(40px,9999px,80px,0);}}
    @keyframes glitch2{0%{clip:rect(55px,9999px,12px,0);}25%{clip:rect(4px,9999px,88px,0);}50%{clip:rect(33px,9999px,61px,0);}75%{clip:rect(70px,9999px,19px,0);}100%{clip:rect(25px,9999px,44px,0);}}

    /* NEON HIGHLIGHT */
    .hl{background:linear-gradient(135deg,#00F5FF,#FF006E);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}

    /* HERO badge cyberpunk */
    .hero-badge{background:rgba(0,245,255,.08);border:1px solid rgba(0,245,255,.4);color:#00F5FF;
      box-shadow:0 0 20px rgba(0,245,255,.15);}
    .hero-badge::before{background:#00F5FF;box-shadow:0 0 10px #00F5FF;}

    /* CARDS 3D tilt */
    .sol-card{transform-style:preserve-3d;transition:transform .15s ease,border-color .3s,box-shadow .3s;
      border-color:rgba(0,245,255,.18);}
    .sol-card:hover{border-color:rgba(0,245,255,.6);
      box-shadow:0 0 20px rgba(0,245,255,.2),0 0 60px rgba(0,245,255,.08),inset 0 0 30px rgba(0,245,255,.03);}

    /* NEON CORNERS on cards */
    .sol-card::after{content:'';position:absolute;inset:0;border-radius:20px;
      background:linear-gradient(135deg,rgba(0,245,255,.06),transparent 40%,rgba(255,0,110,.04));
      pointer-events:none;opacity:0;transition:opacity .3s;}
    .sol-card:hover::after{opacity:1;}

    /* SECTION titles */
    .sec-label{color:#00F5FF;letter-spacing:.2em;text-shadow:0 0 10px rgba(0,245,255,.5);}
    .sec-title{color:var(--txt);}

    /* BUTTONS cyberpunk */
    .btn-primary{background:linear-gradient(135deg,#7B00FF,#00F5FF);
      box-shadow:0 0 20px rgba(0,245,255,.3),0 4px 24px rgba(123,0,255,.4);
      border:1px solid rgba(0,245,255,.3);}
    .btn-primary:hover{box-shadow:0 0 40px rgba(0,245,255,.5),0 8px 32px rgba(123,0,255,.6);}
    .btn-outline{border-color:rgba(0,245,255,.5);color:#00F5FF;
      box-shadow:0 0 10px rgba(0,245,255,.1);}
    .btn-outline:hover{background:rgba(0,245,255,.1);border-color:#00F5FF;
      box-shadow:0 0 20px rgba(0,245,255,.25);}

    /* PILLS */
    .pill{background:rgba(255,224,0,.08);border-color:rgba(255,224,0,.35);color:#FFE000;
      box-shadow:0 0 10px rgba(255,224,0,.12);}
    .hero-badge-cyber{animation:badge-pulse 2.5s ease-in-out infinite;}
    @keyframes badge-pulse{0%,100%{box-shadow:0 0 10px rgba(0,245,255,.2);}50%{box-shadow:0 0 30px rgba(0,245,255,.5);}}

    /* CURSOR cyberpunk */
    .c-dot{background:#00F5FF;box-shadow:0 0 12px #00F5FF,0 0 24px rgba(0,245,255,.5);}
    .c-ring{border-color:rgba(0,245,255,.6);}

    /* SLOTS cyberpunk */
    .slot.sel{background:rgba(0,245,255,.2);border-color:#00F5FF;color:#00F5FF;
      box-shadow:0 0 12px rgba(0,245,255,.3);}

var pCv=document.getElementById('portalCv'),pCtx=pCv.getContext('2d'),pBusy=false;
function runPortal(cb){
  if(pBusy)return;pBusy=true;
  pCv.width=innerWidth;pCv.height=innerHeight;
  pCv.classList.add('go');
  var cx=mx,cy=my,maxR=Math.sqrt(Math.pow(Math.max(cx,innerWidth-cx),2)+Math.pow(Math.max(cy,innerHeight-cy),2));
  var st=null,dur=380;
  (function frame(ts){
    if(!st)st=ts;
    var p=Math.min((ts-st)/dur,1),e=p<.5?2*p*p:-1+(4-2*p)*p;
    pCtx.clearRect(0,0,pCv.width,pCv.height);
    for(var i=7;i>0;i--){
      var r=maxR*e*(i/7),a=(1-p)*(i/7)*.55;
      var g=pCtx.createRadialGradient(cx,cy,0,cx,cy,r);
      g.addColorStop(0,'rgba(124,58,237,'+a+')');
      g.addColorStop(.5,'rgba(168,85,247,'+(a*.5)+')');
      g.addColorStop(1,'rgba(0,0,0,0)');
      pCtx.fillStyle=g;pCtx.beginPath();pCtx.arc(cx,cy,r,0,Math.PI*2);pCtx.fill();
    }
    for(var j=0;j<4;j++){
      pCtx.save();pCtx.translate(cx,cy);pCtx.rotate(e*Math.PI*2*(j%2?1:-1));
      pCtx.strokeStyle='rgba(245,158,11,'+(0.4*(1-p))+')';pCtx.lineWidth=1.2;
      pCtx.beginPath();
      for(var k=0;k<6;k++){var ang=k/6*Math.PI*2;pCtx.moveTo(0,0);pCtx.lineTo(Math.cos(ang)*maxR*e,Math.sin(ang)*maxR*e);}
      pCtx.stroke();pCtx.restore();
    }
    if(p<1){requestAnimationFrame(frame);}
    else{pCtx.clearRect(0,0,pCv.width,pCv.height);pCv.classList.remove('go');pBusy=false;if(cb)cb();}
  })();
}

/* HOURGLASS TIMER */
var HG_DUR=(180+Math.random()*120)*1000,hgSt=Date.now(),hgBonus=0;
document.addEventListener('click',function(){hgBonus+=2800;});
document.addEventListener('scroll',function(){hgBonus+=200;});
var MSGS=[
  {t:100,m:'Oportunidade disponivel',u:null},
  {t:70, m:'Disponibilidade limitada',u:null},
  {t:50, m:'Vagas reduzindo...',u:'Reserve sua vaga!'},
  {t:30, m:'Quase esgotado!',u:'Apenas 2 vagas!'},
  {t:10, m:'Ultima oportunidade!',u:'Feche agora!'}
];
function tickHG(){
  var elapsed = Date.now() - hgSt - hgBonus;
  var pct = Math.max(0, Math.min(1, 1 - elapsed / HG_DUR));

  // AREIA TOP — diminui de baixo pra cima (parte de cima esvazia)
  var sandTopEl = document.getElementById('sTop');
  var sandBotEl = document.getElementById('sBot');
  var fSandTopEl = document.getElementById('fSandTop');
  var fSandBotEl = document.getElementById('fSandBot');

  if(sandTopEl){
    var topH = 37 * pct;
    var topY = 6 + 37 * (1 - pct); // empurra pra baixo conforme esvazia
    sandTopEl.setAttribute('height', topH.toFixed(1));
    sandTopEl.setAttribute('y', topY.toFixed(1));
  }
  if(sandBotEl){
    // Areia sobe de baixo — começa em y=70 e cresce pra cima
    var botH = 37 * (1 - pct);
    sandBotEl.setAttribute('height', botH.toFixed(1));
    // Com transform scale(1,-1) translate(0,-76), o rect cresce pra cima
    sandBotEl.setAttribute('y', (70 - botH).toFixed(1));
  }
  // Mini widget flutuante
  if(fSandTopEl){fSandTopEl.setAttribute('height',(32*pct).toFixed(1));fSandTopEl.setAttribute('y',(6+32*(1-pct)).toFixed(1));}
  if(fSandBotEl){fSandBotEl.setAttribute('height',(32*(1-pct)).toFixed(1));fSandBotEl.setAttribute('y',(70-32*(1-pct)).toFixed(1));}

  // Partículas caindo
  if(pct > 0 && Math.random() > 0.55){
    var sp = document.createElementNS('http://www.w3.org/2000/svg','circle');
    sp.setAttribute('cx','28');sp.setAttribute('cy','37');sp.setAttribute('r','1.5');
    sp.setAttribute('fill','rgba(255,224,0,.95)');
    var pg = document.getElementById('sP'); if(pg) pg.appendChild(sp);
    var ss = Date.now();
    (function(el){(function a(){var pp=(Date.now()-ss)/200;
      el.setAttribute('cy',String(37+5*pp));el.setAttribute('opacity',String(1-pp));
      if(pp<1)requestAnimationFrame(a);else if(el.parentNode)el.parentNode.removeChild(el);
    })();})(sp);
  }

  // Mensagens de urgência
  var p100 = pct * 100;
  var msgs = [{t:100,m:'Oportunidade disponível',u:null},{t:70,m:'Disponibilidade limitada',u:null},{t:50,m:'Vagas reduzindo...',u:'Reserve sua vaga!'},{t:30,m:'Quase esgotado!',u:'Apenas 2 vagas!'},{t:10,m:'Última oportunidade!',u:'Feche agora!'}];
  var cur = msgs[0];
  for(var i=msgs.length-1;i>=0;i--)if(p100<=msgs[i].t){cur=msgs[i];break;}
  var mEl=document.getElementById('hgMsg'),uEl=document.getElementById('hgUrg');
  if(mEl)mEl.textContent=cur.m;
  if(uEl){if(cur.u){uEl.style.display='block';uEl.textContent=cur.u;}else uEl.style.display='none';}
  var w=document.getElementById('hgW');
  if(w){if(pct<.3)w.style.borderColor='rgba(239,68,68,.7)';else if(pct<.6)w.style.borderColor='rgba(255,224,0,.5)';}

  if(pct>0)requestAnimationFrame(tickHG);
}
requestAnimationFrame(tickHG);
</script>
